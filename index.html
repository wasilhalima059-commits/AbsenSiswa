<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input[type="date"], button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Form Absensi Siswa</h2>

    <form id="formAbsensi">
      <!-- 1. Elemen UI Selection Siswa -->
      <div class="form-group">
        <label for="selectSiswa">Pilih Siswa:</label>
        <select id="selectSiswa" required>
          <option value="">-- Memuat data siswa... --</option>
        </select>
      </div>

      <!-- 2. Elemen UI Tanggal -->
      <div class="form-group">
        <label for="inputTanggal">Tanggal:</label>
        <input type="date" id="inputTanggal" required>
      </div>

      <!-- 3. Elemen UI Selection Status Absensi -->
      <div class="form-group">
        <label for="selectStatus">Status Kehadiran:</label>
        <select id="selectStatus" required>
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Alpa">Alpa</option>
        </select>
      </div>

      <button type="submit">Simpan Absensi</button>
    </form>

    <!-- Tabel Rekap Absensi -->
    <h3>Rekap Absensi Hari Ini</h3>
    <table>
      <thead>
        <tr>
          <th>NIS</th>
          <th>Nama</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabelAbsensi">
        <!-- Data absensi yang disimpan akan muncul di sini -->
      </tbody>
    </table>
  </div>

  <!-- Script JavaScript untuk Menghubungkan UI dengan data_siswa.json -->
  <script>
    // Set tanggal default ke hari ini
    document.getElementById('inputTanggal').valueAsDate = new Date();

    // Mengambil data dari file data_siswa.json
    fetch('data_siswa.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Gagal mengambil file JSON');
        }
        return response.json();
      })
      .then(dataSiswa => {
        const selectSiswa = document.getElementById('selectSiswa');
        selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';

        // Memasukkan setiap siswa ke dalam dropdown (UI selection)
        dataSiswa.forEach(siswa => {
          const option = document.createElement('option');
          option.value = siswa.nis;
          option.textContent = `${siswa.nis} - ${siswa.nama}`;
          // Menyimpan nama siswa di atribut data agar mudah diambil saat submit
          option.setAttribute('data-nama', siswa.nama);
          selectSiswa.appendChild(option);
        });
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('selectSiswa').innerHTML = '<option value="">Gagal memuat data siswa</option>';
      });

    // Menangani penambahan data absensi ke tabel
    document.getElementById('formAbsensi').addEventListener('submit', function(e) {
      e.preventDefault();

      const selectSiswa = document.getElementById('selectSiswa');
      const nis = selectSiswa.value;
      const nama = selectSiswa.options[selectSiswa.selectedIndex].getAttribute('data-nama');
      const status = document.getElementById('selectStatus').value;

      if (!nis) return;

      // Tambah baris baru ke tabel
      const tabel = document.getElementById('tabelAbsensi');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${nis}</td>
        <td>${nama}</td>
        <td><strong>${status}</strong></td>
      `;
      tabel.appendChild(row);

      // Reset pilihan dropdown
      selectSiswa.value = '';
    });
  </script>

</body>
</html>
