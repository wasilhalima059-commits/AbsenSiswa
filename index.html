<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Siswa - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            background: #2563eb;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 12px;
        }
        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .badge-hash {
            font-size: 0.75rem;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-graduation-cap fa-3x mb-2"></i>
        <h4>Sistem Presensi Siswa</h4>
        <p class="mb-0 text-white-50">Silakan login sesuai peran Anda</p>
    </div>
    <div class="login-body">
        <form id="loginForm">
            <!-- Pilihan Kelas -->
            <div class="mb-3">
                <label for="kelas" class="form-label font-weight-bold"><i class="fa-solid fa-school me-2"></i>Pilih Kelas</label>
                <select class="form-select" id="kelas" required>
                    <option value="" selected disabled>-- Pilih Kelas --</option>
                    <option value="X IPA 1">X IPA 1</option>
                    <option value="XI IPS 1">XI IPS 1</option>
                </select>
            </div>

            <!-- Pilihan Role -->
            <div class="mb-3">
                <label for="role" class="form-label"><i class="fa-solid fa-user-tag me-2"></i>Login Sebagai</label>
                <select class="form-select" id="role" required>
                    <option value="" selected disabled>-- Pilih Peran --</option>
                    <option value="guru">Guru</option>
                    <option value="murid">Murid</option>
                </select>
            </div>

            <!-- Field Input Guru -->
            <div id="guruFields" class="d-none">
                <div class="mb-3">
                    <label for="namaGuru" class="form-label"><i class="fa-solid fa-user-tie me-2"></i>Nama Guru</label>
                    <input type="text" class="form-control" id="namaGuru" placeholder="Masukkan nama Anda">
                </div>
                <div class="mb-3">
                    <label for="passwordGuru" class="form-label"><i class="fa-solid fa-key me-2"></i>Password Guru</label>
                    <input type="password" class="form-control" id="passwordGuru" placeholder="Password default: 2334">
                </div>
            </div>

            <!-- Field Input Murid -->
            <div id="muridFields" class="d-none">
                <div class="mb-3">
                    <label for="nisMurid" class="form-label"><i class="fa-solid fa-id-card me-2"></i>NIS (Nomor Induk Siswa)</label>
                    <input type="text" class="form-control" id="nisMurid" placeholder="Contoh: 1001 / 1002">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk Aplikasi
            </button>
        </form>

        <div class="alert alert-info mt-4 mb-0 p-2 text-center" style="font-size: 0.85rem;">
            <i class="fa-solid fa-shield-halved me-1"></i> Keamanan: Data kredensial dienkripsi dengan <strong>SHA-256</strong>.
        </div>
    </div>
</div>

<script>
    // Initialize Data in localStorage if not exists
    async function initData() {
        if (!localStorage.getItem('presensiData')) {
            const res = await fetch('data.json');
            const data = await res.json();
            localStorage.setItem('presensiData', JSON.stringify(data));
        }
    }
    initData();

    const roleSelect = document.getElementById('role');
    const guruFields = document.getElementById('guruFields');
    const muridFields = document.getElementById('muridFields');

    roleSelect.addEventListener('change', function() {
        if (this.value === 'guru') {
            guruFields.classList.remove('d-none');
            muridFields.classList.add('d-none');
            document.getElementById('namaGuru').required = true;
            document.getElementById('passwordGuru').required = true;
            document.getElementById('nisMurid').required = false;
        } else if (this.value === 'murid') {
            muridFields.classList.remove('d-none');
            guruFields.classList.add('d-none');
            document.getElementById('nisMurid').required = true;
            document.getElementById('namaGuru').required = false;
            document.getElementById('passwordGuru').required = false;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const kelas = document.getElementById('kelas').value;
        const role = roleSelect.value;
        const storeData = JSON.parse(localStorage.getItem('presensiData'));

        if (role === 'guru') {
            const nama = document.getElementById('namaGuru').value;
            const password = document.getElementById('passwordGuru').value;
            const hashedInputPassword = CryptoJS.SHA256(password).toString();

            // Verifikasi password SHA256 (2334)
            const expectedHash = CryptoJS.SHA256("2334").toString();

            if (hashedInputPassword === expectedHash) {
                const session = {
                    role: 'guru',
                    nama: nama,
                    kelas: kelas
                };
                localStorage.setItem('userSession', JSON.stringify(session));
                window.location.href = 'guru.html';
            } else {
                alert('Password Guru salah! (Password default: 2334)');
            }
        } else if (role === 'murid') {
            const nis = document.getElementById('nisMurid').value.trim();
            const hashedNIS = CryptoJS.SHA256(nis).toString();

            // Cari siswa berdasarkan kelas dan hash NIS
            const foundSiswa = storeData.siswa.find(s => s.kelas === kelas && s.nis_hash === hashedNIS);

            if (foundSiswa) {
                const session = {
                    role: 'murid',
                    nis: foundSiswa.nis,
                    nama: foundSiswa.nama,
                    kelas: kelas
                };
                localStorage.setItem('userSession', JSON.stringify(session));
                window.location.href = 'murid.html';
            } else {
                alert('NIS tidak ditemukan di kelas ' + kelas + '!
Pastikan NIS dan Kelas yang dipilih sesuai.');
            }
        }
    });
</script>

</body>
</html>
