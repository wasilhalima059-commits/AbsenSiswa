<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Presensi - Murid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #0f172a;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .badge-hadir { background-color: #22c55e; }
        .badge-izin { background-color: #eab308; }
        .badge-sakit { background-color: #06b6d4; }
        .badge-alpa { background-color: #ef4444; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-user-graduate me-2"></i>Portal Murid - Status Presensi</a>
        <div class="d-flex align-items-center text-white">
            <span class="me-3" id="userDisplay"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i>Keluar</button>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="row mb-4">
        <div class="col-md-4 mb-3 mb-md-0">
            <div class="card p-3 text-center">
                <small class="text-muted">Nama Siswa</small>
                <h5 class="fw-bold mb-0" id="namaSiswa">-</h5>
            </div>
        </div>
        <div class="col-md-4 mb-3 mb-md-0">
            <div class="card p-3 text-center">
                <small class="text-muted">NIS</small>
                <h5 class="fw-bold mb-0" id="nisSiswa">-</h5>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center">
                <small class="text-muted">Kelas</small>
                <h5 class="fw-bold mb-0" id="kelasSiswa">-</h5>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-white py-3">
            <h5 class="card-title fw-bold text-primary mb-0"><i class="fa-solid fa-clock-rotate-left me-2"></i>Riwayat Kehadiran</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">No</th>
                            <th>Tanggal</th>
                            <th>Kelas</th>
                            <th class="text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPresensi">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const session = JSON.parse(localStorage.getItem('userSession'));
    if (!session || session.role !== 'murid') {
        window.location.href = 'index.html';
    }

    document.getElementById('userDisplay').innerText = session.nama;
    document.getElementById('namaSiswa').innerText = session.nama;
    document.getElementById('nisSiswa').innerText = session.nis;
    document.getElementById('kelasSiswa').innerText = session.kelas;

    const dataStore = JSON.parse(localStorage.getItem('presensiData'));
    const presensiSaya = dataStore.presensi.filter(p => p.nis === session.nis);

    function loadHistory() {
        const tbody = document.getElementById('tabelPresensi');
        tbody.innerHTML = '';

        if (presensiSaya.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">Belum ada data presensi yang direkap oleh guru.</td></tr>`;
            return;
        }

        presensiSaya.forEach((item, index) => {
            let badgeClass = 'bg-secondary';
            if (item.status === 'Hadir') badgeClass = 'badge-hadir';
            else if (item.status === 'Izin') badgeClass = 'badge-izin';
            else if (item.status === 'Sakit') badgeClass = 'badge-sakit';
            else if (item.status === 'Alpa') badgeClass = 'badge-alpa';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="ps-4">${index + 1}</td>
                <td>${item.tanggal}</td>
                <td>${item.kelas}</td>
                <td class="text-center">
                    <span class="badge ${badgeClass} fs-6 px-3 py-2">${item.status}</span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function logout() {
        localStorage.removeItem('userSession');
        window.location.href = 'index.html';
    }

    loadHistory();
</script>
</body>
</html>
