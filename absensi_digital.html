<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Digital — Dashboard</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2f;--line:#ffffff19;--text:#edf6ff;--muted:#91a5bf;--primary:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{width:min(1250px,calc(100% - 20px));margin:auto;padding:18px 0 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.brand b{display:block}.brand small,.muted{color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.pill,.btn{border:1px solid #ffffff19;background:#ffffff08;color:#dbeafe;padding:9px 12px;border-radius:11px;font-size:12px}.btn{cursor:pointer}.logout{border-color:#fb718533;color:#fecdd3}.hero,.card{border:1px solid #ffffff19;background:#0d1b2fdd;border-radius:20px;box-shadow:0 20px 60px #0004}.hero{padding:24px;margin-bottom:15px}.hero h1{margin:5px 0;font-size:clamp(25px,4vw,39px)}.hero p{margin:5px 0;color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:15px}.stat{padding:15px;border:1px solid #ffffff19;border-radius:16px;background:#ffffff05}.stat small{color:var(--muted);font-size:10px}.stat b{display:block;font-size:25px;margin-top:5px}.cardhead{padding:17px;border-bottom:1px solid #ffffff19;display:flex;justify-content:space-between;gap:10px;align-items:center}.cardhead h2{margin:0;font-size:16px}.tools{display:flex;gap:7px}.search,.date{background:#061323;color:white;border:1px solid #ffffff19;padding:9px 11px;border-radius:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #ffffff0d;text-align:left;font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase}.status{border:1px solid #ffffff19;background:#091a2c;color:white;padding:8px;border-radius:9px}.readonly{color:#9fb1c7}.notice{margin:15px 0 0;padding:12px;border:1px solid #38bdf833;background:#38bdf80a;border-radius:12px;color:#bfeaff;font-size:12px}.empty{text-align:center;padding:35px;color:var(--muted)}.hidden{display:none}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.cardhead{align-items:stretch;flex-direction:column}.tools{flex-wrap:wrap}.search{flex:1}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><b>✓ Absensi Digital</b><small>Dashboard kehadiran</small></div><div class="actions"><span class="pill" id="rolePill">—</span><span class="pill" id="classPill">—</span><button class="btn logout" id="logout">Keluar</button></div></header>
<section class="hero"><h1 id="title">Memuat...</h1><p id="subtitle"></p><div class="notice" id="notice"></div></section>
<section class="stats"><div class="stat"><small>Total siswa</small><b id="total">0</b></div><div class="stat"><small>Hadir</small><b id="hadir">0</b></div><div class="stat"><small>Izin</small><b id="izin">0</b></div><div class="stat"><small>Sakit</small><b id="sakit">0</b></div><div class="stat"><small>Alpha</small><b id="alpha">0</b></div></section>
<section class="card"><div class="cardhead"><div><h2>Rekap kehadiran</h2><span class="muted" id="dateText"></span></div><div class="tools"><input class="search" id="search" placeholder="Cari nama..."><input class="date" id="date" type="date"><button class="btn" id="all">Semua Hadir</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>No</th><th>Nama</th><th>JK</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div><div class="empty hidden" id="empty">Tidak ada siswa.</div></section>
</div>
<script>
(()=>{"use strict";
const SESSION_KEY="absensi_session_v3",DATA_URL="data_siswa.json",STATUS=["Hadir","Izin","Sakit","Alpha"];
let session,data={},students=[],dateKey="";
const $=id=>document.getElementById(id);
function loadSession(){try{session=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch{session=null}if(!session?.role||!session?.className){location.href="index.html";return false}return true}
function key(){return `absensi_v3_${session.className}_${dateKey}`}
function record(){try{return JSON.parse(localStorage.getItem(key())||"{}")}catch{return {}}}
function save(r){localStorage.setItem(key(),JSON.stringify(r))}
function today(){let d=new Date();return d.toISOString().slice(0,10)}
function stats(){let r=record(),c={Hadir:0,Izin:0,Sakit:0,Alpha:0};students.forEach(s=>c[r[s.uid]||"Hadir"]++);$("total").textContent=students.length;$("hadir").textContent=c.Hadir;$("izin").textContent=c.Izin;$("sakit").textContent=c.Sakit;$("alpha").textContent=c.Alpha}
function render(){let q=$("search").value.toLowerCase(),r=record(),body=$("body");body.innerHTML="";let n=0;students.forEach(s=>{if(q&&!s.nama.toLowerCase().includes(q))return;n++;let tr=document.createElement("tr");tr.innerHTML=`<td>${s.no}</td><td><b>${s.nama}</b></td><td>${s.jk||"-"}</td><td></td>`;let td=tr.lastElementChild;if(session.role==="guru"){let sel=document.createElement("select");sel.className="status";STATUS.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)});sel.value=r[s.uid]||"Hadir";sel.onchange=()=>{let x=record();x[s.uid]=sel.value;save(x);render()};td.appendChild(sel)}else{td.innerHTML=`<span class="readonly">${r[s.uid]||"Hadir"}</span>`}body.appendChild(tr)});$("empty").classList.toggle("hidden",n>0);stats()}
function setup(){if(!loadSession())return;fetch(DATA_URL,{cache:"no-store"}).then(r=>r.json()).then(d=>{data=d;students=data[session.className]||[];if(!students.length)throw Error("kelas");dateKey=today();$("date").value=dateKey;$("rolePill").textContent=session.role==="guru"?"👨‍🏫 Guru":"👨‍🎓 Murid";$("classPill").textContent=session.className;$("title").textContent=session.role==="guru"?`Rekap ${session.className}`:`Kehadiran ${session.className}`;$("subtitle").textContent=session.role==="guru"?"Pilih status setiap siswa lalu rekap akan tersimpan di perangkat ini.":"Ini adalah hasil rekap yang dibuat guru. Kamu tidak dapat mengubah status.";$("notice").textContent=session.role==="guru"?"Mode guru aktif: status dapat diubah.":"Mode murid aktif: data hanya dapat dilihat.";render()}).catch(()=>{location.href="index.html"})}
$("search").oninput=render;$("date").onchange=()=>{dateKey=$("date").value;render()};$("all").onclick=()=>{if(session.role!=="guru")return;let r={};students.forEach(s=>r[s.uid]="Hadir");save(r);render()};$("logout").onclick=()=>{sessionStorage.removeItem(SESSION_KEY);location.href="index.html"};setup();
})();
</script>
</body></html>
